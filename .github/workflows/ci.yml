name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit specs
        run: pnpm test

      # A dead address so the build never depends on the live relayer.
      - name: Build
        run: pnpm build
        env:
          STATS_API_URL: http://127.0.0.1:9
